services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: bpm-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bpm-network

  bpm-main-service:
    build:
      context: .
      dockerfile: ./bpm-main-service/Dockerfile
    container_name: bpm-main-service
    ports:
      - "8080:8080"
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=guest
      - SPRING_RABBITMQ_PASSWORD=guest
      - GRPC_ONBOARDING_ADDRESS=static://bpm-onboarding-service:9090
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - bpm-network
    restart: unless-stopped

  bpm-audit-service:
    build:
      context: .
      dockerfile: ./bpm-audit-service/Dockerfile
    container_name: bpm-audit-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=guest
      - SPRING_RABBITMQ_PASSWORD=guest
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - bpm-network
    restart: unless-stopped

  bpm-statistics-service:
    build:
      context: .
      dockerfile: ./bpm-statistics-service/Dockerfile
    container_name: bpm-statistics-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=guest
      - SPRING_RABBITMQ_PASSWORD=guest
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - bpm-network
    restart: unless-stopped

  bpm-compliance-service:
    build:
      context: .
      dockerfile: ./bpm-compliance-service/Dockerfile
    container_name: bpm-compliance-service
    ports:
      - "8085:8085"
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=guest
      - SPRING_RABBITMQ_PASSWORD=guest
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - bpm-network
    restart: unless-stopped

  notification-service:
    build:
      context: .
      dockerfile: ./notification-service/Dockerfile
    container_name: notification-service
    ports:
      - "8086:8086"
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=guest
      - SPRING_RABBITMQ_PASSWORD=guest
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - bpm-network
    restart: unless-stopped

  bpm-onboarding-service:
    build:
      context: .
      dockerfile: ./bpm-onboarding-service/Dockerfile
    container_name: bpm-onboarding-service
    ports:
      - "8084:8084"
      - "9090:9090"
    networks:
      - bpm-network
    restart: unless-stopped

networks:
  bpm-network:
    driver: bridge

volumes:
  rabbitmq_data:
