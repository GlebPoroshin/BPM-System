services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: bpm-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bpm-network

  zipkin:
    image: openzipkin/zipkin
    container_name: bpm-zipkin
    ports:
      - "9411:9411"
    networks:
      - bpm-network

  prometheus:
    image: prom/prometheus
    container_name: bpm-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - bpm-network
    depends_on:
      - bpm-audit-service
      - bpm-compliance-service
      - bpm-main-service
      - bpm-onboarding-service
      # - bpm-statistics-service
      - notification-service

  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: bpm-jenkins
    privileged: true
    user: root
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      - ./jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - bpm-network

  bpm-main-service:
    build:
      context: .
      dockerfile: ./bpm-main-service/Dockerfile
    container_name: bpm-main-service
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=guest
      - SPRING_RABBITMQ_PASSWORD=guest
      - GRPC_ONBOARDING_ADDRESS=static://bpm-onboarding-service:9091
      - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://zipkin:9411/api/v2/spans
    depends_on:
      rabbitmq:
        condition: service_healthy
      zipkin:
        condition: service_started
    networks:
      - bpm-network
    restart: unless-stopped

  bpm-audit-service:
    build:
      context: .
      dockerfile: ./bpm-audit-service/Dockerfile
    container_name: bpm-audit-service
    ports:
      - "8082:8082"
    deploy:
      resources:
        limits:
          memory: 384M
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=guest
      - SPRING_RABBITMQ_PASSWORD=guest
      - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://zipkin:9411/api/v2/spans
    depends_on:
      rabbitmq:
        condition: service_healthy
      zipkin:
        condition: service_started
    networks:
      - bpm-network
    restart: unless-stopped

  # bpm-statistics-service:
  #   build:
  #     context: .
  #     dockerfile: ./bpm-statistics-service/Dockerfile
  #   container_name: bpm-statistics-service
  #   ports:
  #     - "8083:8083"
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 384M
  #   environment:
  #     - SPRING_RABBITMQ_HOST=rabbitmq
  #     - SPRING_RABBITMQ_PORT=5672
  #     - SPRING_RABBITMQ_USERNAME=guest
  #     - SPRING_RABBITMQ_PASSWORD=guest
  #     - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://zipkin:9411/api/v2/spans
  #   depends_on:
  #     rabbitmq:
  #       condition: service_healthy
  #     zipkin:
  #       condition: service_started
  #   networks:
  #     - bpm-network
  #   restart: unless-stopped

  bpm-compliance-service:
    build:
      context: .
      dockerfile: ./bpm-compliance-service/Dockerfile
    container_name: bpm-compliance-service
    ports:
      - "8085:8085"
    deploy:
      resources:
        limits:
          memory: 384M
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=guest
      - SPRING_RABBITMQ_PASSWORD=guest
      - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://zipkin:9411/api/v2/spans
    depends_on:
      rabbitmq:
        condition: service_healthy
      zipkin:
        condition: service_started
    networks:
      - bpm-network
    restart: unless-stopped

  notification-service:
    build:
      context: .
      dockerfile: ./notification-service/Dockerfile
    container_name: notification-service
    ports:
      - "8086:8086"
    deploy:
      resources:
        limits:
          memory: 384M
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=guest
      - SPRING_RABBITMQ_PASSWORD=guest
      - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://zipkin:9411/api/v2/spans
    depends_on:
      rabbitmq:
        condition: service_healthy
      zipkin:
        condition: service_started
    networks:
      - bpm-network
    restart: unless-stopped

  bpm-onboarding-service:
    build:
      context: .
      dockerfile: ./bpm-onboarding-service/Dockerfile
    container_name: bpm-onboarding-service
    ports:
      - "8084:8084"
      - "9091:9091"
    deploy:
      resources:
        limits:
          memory: 384M
    environment:
      - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://zipkin:9411/api/v2/spans
    depends_on:
      zipkin:
        condition: service_started
    networks:
      - bpm-network
    restart: unless-stopped

networks:
  bpm-network:
    driver: bridge

volumes:
  rabbitmq_data:
