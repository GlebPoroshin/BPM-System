syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.rut.glebporoshin.sop.grpc.onboarding";
option java_outer_classname = "OnboardingServiceProto";

service OnboardingService {
  rpc CreateOnboarding(CreateOnboardingRequest) returns (CreateOnboardingResponse);
  rpc GetOnboardingStatus(GetOnboardingStatusRequest) returns (GetOnboardingStatusResponse);
  rpc UpdateOnboardingTask(UpdateOnboardingTaskRequest) returns (UpdateOnboardingTaskResponse);
}

message OnboardingRecord {
  string onboarding_id = 1;
  string employee_id = 2;
  string status = 3;
  repeated OnboardingTask tasks = 4;
}

message OnboardingTask {
  string task_id = 1;
  string name = 2;
  bool completed = 3;
}

message CreateOnboardingRequest {
  string employee_id = 1;
  string position = 2;
}

message CreateOnboardingResponse {
  OnboardingRecord onboarding = 1;
}

message GetOnboardingStatusRequest {
  string onboarding_id = 1;
}

message GetOnboardingStatusResponse {
  OnboardingRecord onboarding = 1;
}

message UpdateOnboardingTaskRequest {
  string onboarding_id = 1;
  string task_id = 2;
  bool completed = 3;
}

message UpdateOnboardingTaskResponse {
  OnboardingRecord onboarding = 1;
}

