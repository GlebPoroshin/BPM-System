spring.application.name=bpm-compliance-service
server.port=8085

springdoc.api-docs.path=/compliance/v3/api-docs
springdoc.swagger-ui.path=/compliance/swagger-ui.html
springdoc.swagger-ui.enabled=true

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.retry.enabled=false

logging.level.root=INFO
logging.level.com.rut.glebporoshin.sop.bpm_compliance_service=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - [%X{correlationId}] [%X{traceId}] - %msg%n

compliance.overdue-check-ms=60000

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans
management.metrics.export.prometheus.enabled=true
